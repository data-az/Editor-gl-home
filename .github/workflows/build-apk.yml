name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP в репозитории не найден"
            ls -la
            exit 1
          fi
          rm -rf project && mkdir project
          unzip -q "$ZIP" -d project
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: в архиве нет settings.gradle.kts"
            exit 1
          fi
          PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Write gradle.properties
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' \
            > "$PROJECT_DIR/gradle.properties"
          cat "$PROJECT_DIR/gradle.properties"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find project -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK не создан"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: HomeEditor-debug
          path: ${{ env.APK_PATH }}
